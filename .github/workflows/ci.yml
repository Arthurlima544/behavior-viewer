name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, tipos, testes e E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  imagem:
    name: Imagem Docker (amd64 e arm64)
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build multi-arquitetura (RNF-02)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Teste de fumaça com a imagem amd64
        run: |
          docker build -f docker/Dockerfile -t behavior-viewer:ci .
          docker run -d --name bv -p 127.0.0.1:8787:8787 -e BEHAVIOR_BROWSE_ROOTS=/host -v "$PWD:/host:ro" behavior-viewer:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8787/api/v1/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs bv
          exit 1
