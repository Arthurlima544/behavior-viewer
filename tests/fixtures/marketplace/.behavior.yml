nome: Marketplace
descricao: App de compras, loja web e API de pedidos
# Fixture: projeto com três stacks declaradas (RF-03, RF-05).
stacks:
  - id: flutter
    caminho: app
    relatorios:
      - build/test-results/*.xml
  - id: typescript
    caminho: web
    relatorios:
      - reports/cucumber.json
  - id: java
    caminho: api
    relatorios:
      - target/cucumber.json
# Mapa de telas (docs/prompts, seção 2): liga as tags @tela: e as rotas citadas nos passos.
telas:
  - nome: CheckoutPage
    rota: /checkout
    arquivo: web/src/pages/CheckoutPage.tsx
    componentes:
      - nome: FormularioEndereco
        arquivo: web/src/components/FormularioEndereco.tsx
      - nome: ResumoCarrinho
        arquivo: web/src/components/ResumoCarrinho.tsx
  - nome: CupomPage
    rota: /carrinho/cupom
    arquivo: web/src/pages/CupomPage.tsx
ignorar:
  - "**/rascunhos/**"
